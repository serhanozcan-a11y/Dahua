services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: dahua
      POSTGRES_USER: dahua
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env dosyasinda DB_PASSWORD tanimlayin}
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dahua"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: ./collector
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dahua:${DB_PASSWORD}@db:5432/dahua
      SECRET_KEY: ${SECRET_KEY}
    env_file:
      - .env
    volumes:
      - ./devices.yaml:/app/devices.yaml:ro
    restart: unless-stopped

  # NVR envanter yönetimi + parola girişi (http://sunucu:8000, kullanıcı: admin)
  panel:
    build: ./collector
    command: uvicorn dahua_monitor.panel:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dahua:${DB_PASSWORD}@db:5432/dahua
      SECRET_KEY: ${SECRET_KEY:?.env dosyasinda SECRET_KEY tanimlayin}
      PANEL_PASSWORD: ${PANEL_PASSWORD:?.env dosyasinda PANEL_PASSWORD tanimlayin}
    ports:
      - "8000:8000"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Gerçek NVR olmadan uçtan uca deneme için sahte cihaz.
  # devices.yaml'a host: nvr-sim, port: 8080 ile eklenir.
  nvr-sim:
    image: python:3.11-slim
    command: python /sim/nvr_sim.py
    environment:
      SIM_SCENARIO: ${SIM_SCENARIO:-healthy}
    volumes:
      - ./simulator:/sim:ro
    profiles: ["dev"]
