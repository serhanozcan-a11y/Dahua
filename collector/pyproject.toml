[project]
name = "dahua-monitor"
version = "0.1.0"
description = "Dahua 608 serisi NVR disk/RAID saglik izleme toplayicisi"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "asyncpg>=0.29",
    "cryptography>=42.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dahua-monitor = "dahua_monitor.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dahua_monitor*"]

[tool.setuptools.package-data]
dahua_monitor = ["*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
